services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-tasksdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasks} -d ${POSTGRES_DB:-tasksdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./app
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tasks}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-tasksdb}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: