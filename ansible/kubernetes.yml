---
- name: Install Kubernetes packages
  hosts: k8s_cluster
  become: true
  vars:
    k8s_minor: "v1.36"

  tasks:
    - name: Add official Kubernetes repo (with exclude)
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes {{ k8s_minor }}
        baseurl: "https://pkgs.k8s.io/core:/stable:/{{ k8s_minor }}/rpm/"
        gpgcheck: true
        gpgkey: "https://pkgs.k8s.io/core:/stable:/{{ k8s_minor }}/rpm/repodata/repomd.xml.key"
        exclude: kubelet kubeadm kubectl cri-tools kubernetes-cni

    - name: Install kubelet, kubeadm, kubectl and tc
      ansible.builtin.dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
          - iproute-tc
        state: present
        disable_excludes: kubernetes

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

    - name: Stop and disable firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: false
      register: fw
      failed_when: fw is failed and 'Could not find' not in (fw.msg | default(''))
