---
- name: Prepare all nodes (baseline)
  hosts: k8s_cluster
  become: true

  vars:
    admin_tools:
      - nano
      - vim
      - git
      - curl
      - wget
      - bash-completion
      - tar
      - tmux
    net_tools:
      - iproute
      - net-tools
      - bind-utils
      - traceroute
      - tcpdump
      - lsof
      - sysstat
    base_packages:
      - python3
      - python3-pip
      - dnf-utils   #   needs-restarting

  tasks:
    - name: Update DNF cache and upgrade all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Install admin tools
      ansible.builtin.dnf:
        name: "{{ admin_tools }}"
        state: present

    - name: Install networking and troubleshooting tools
      ansible.builtin.dnf:
        name: "{{ net_tools }}"
        state: present

    - name: Install python3, pip and dnf-utils
      ansible.builtin.dnf:
        name: "{{ base_packages }}"
        state: present

    - name: Enable and start chronyd and sshd
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - chronyd
        - sshd

    - name: Show system facts summary
      ansible.builtin.debug:
        msg:
          - "Hostname : {{ ansible_hostname }}"
          - "OS       : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel   : {{ ansible_kernel }}"
          - "vCPU     : {{ ansible_processor_vcpus }}"
          - "RAM (MB) : {{ ansible_memtotal_mb }}"

    - name: Check if reboot is needed
      ansible.builtin.command: needs-restarting -r
      register: reboot_check
      changed_when: false
      failed_when: reboot_check.rc not in [0, 1]

    - name: Reboot w1 only if needed
      ansible.builtin.reboot:
        reboot_timeout: 600
      when:
        - reboot_check.rc == 1
        - "'k8s_workers' in group_names"

    - name: Warn if cp1 needs a manual reboot (never auto-reboot cp1)
      ansible.builtin.debug:
        msg: "cp1 needs a reboot. Do it manually, not with Ansible."
      when:
        - reboot_check.rc == 1
        - "'k8s_master' in group_names"
