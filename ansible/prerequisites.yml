---
- name: OS prerequisites for Kubernetes
  hosts: k8s_cluster
  become: true

  tasks:
    - name: Turn off swap now
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | int > 0

    - name: Remove swap from /etc/fstab (permanent)
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#\n].*\sswap\s.*)$'
        replace: '# \1'

    - name: Set SELinux to permissive now
      ansible.builtin.command: setenforce 0
      when:
        - ansible_selinux.status == 'enabled'
        - ansible_selinux.mode == 'enforcing'

    - name: Set SELinux to permissive (permanent)
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: 'SELINUX=permissive'

    - name: Load kernel modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'
      notify: Load kernel modules now

    - name: Set sysctl parameters for Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        mode: '0644'
      notify: Apply sysctl

  handlers:
    - name: Load kernel modules now
      ansible.builtin.command: modprobe {{ item }}
      loop:
        - overlay
        - br_netfilter

    - name: Apply sysctl
      ansible.builtin.command: sysctl --system

